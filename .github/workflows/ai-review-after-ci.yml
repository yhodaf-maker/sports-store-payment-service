name: AI Review After CI

on:
  workflow_run:
    workflows: ["PR Quality and Security Validation"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  review:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null &&
      github.event.workflow_run.pull_requests[1].number == null
    uses: ./.github/workflows/reusable-ai-review.yml
    with:
      pull_request_number: ${{ github.event.workflow_run.pull_requests[0].number }}
      repository: ${{ github.repository }}
      base_commit_sha: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
      head_commit_sha: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
      reviewed_commit_sha: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
      workflow_run_id: ${{ github.event.workflow_run.id }}
      required_ci_jobs_json: >-
        ["Branch name validation","Python Quality and Tests","Secret Scanning","Dockerfile Policy","Container Vulnerabilities","Semgrep SAST (report only)","Dependency SCA (report only)"]
    secrets:
      openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
