name: PR Quality and Security

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt ruff
      - run: ruff check . --select E4,E7,E9,F
      - run: pytest

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: dockerfile
      - run: docker build --tag sports-store-payment-service:pr-${{ github.sha }} .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sports-store-payment-service:pr-${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
