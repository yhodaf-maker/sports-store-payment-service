name: PR Quality and Security Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: Branch name validation
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          if [[ ! "$BRANCH_NAME" =~ ^(feature|bugfix|hotfix)/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            printf 'Invalid branch name: %s\n' "$BRANCH_NAME"
            printf 'Use feature/, bugfix/, or hotfix/ followed by a lowercase kebab-case slug.\n'
            exit 1
          fi

  quality:
    name: Python Quality and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt ruff==0.16.0

      - name: Verify dependency compatibility
        run: python -m pip check

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  secrets:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks 8.28.0
        env:
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
          GITLEAKS_VERSION: 8.28.0
        run: |
          cd "${RUNNER_TEMP}"
          curl --fail --location --silent --show-error \
            --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file gitleaks.tar.gz gitleaks
          sudo install --mode 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan pull request history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git --redact --no-banner --log-opts="${BASE_SHA}..${HEAD_SHA}" .

      - name: Scan current files
        run: gitleaks dir --redact --no-banner .

  dockerfile:
    name: Dockerfile Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Scan root Dockerfile
        uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7
        with:
          file: Dockerfile
          framework: dockerfile
          output_format: cli

  container:
    name: Container Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_REF: payment-service:pr-${{ github.event.pull_request.number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Build local image
        run: docker build --pull --tag "${IMAGE_REF}" .

      - name: Scan patched high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
          scanners: vuln

  sast:
    name: Semgrep SAST (report only)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEMGREP_IMAGE: semgrep/semgrep@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b
      SEMGREP_VERSION: 1.172.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Verify pinned Semgrep version
        run: |
          actual_version="$(docker run --rm "$SEMGREP_IMAGE" semgrep --version)"
          test "$actual_version" = "$SEMGREP_VERSION"

      # Full report-only scan for the initial tuning phase. Findings are printed
      # to the job log without failing the job. Scanner/configuration
      # failures retain the nonzero exit code returned by docker run.
      - name: Run Semgrep full scan (report only)
        run: |
          docker run --rm \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/src,readonly" \
            --workdir /src \
            "$SEMGREP_IMAGE" \
            semgrep scan --config auto .

  sca:
    name: Dependency SCA (report only)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIP_AUDIT_IMAGE: python:3.11.15-slim-bookworm@sha256:d29f48a31a8b408ed19272ca1e7b10ebae13b240a27e862d3d4217c528e2e0c3
      PIP_AUDIT_VERSION: 2.10.1
      SCA_MANIFESTS: requirements.txt requirements-dev.txt
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Audit Python dependencies
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dependency-sca"
          for manifest in $SCA_MANIFESTS; do
            report="$RUNNER_TEMP/dependency-sca/${manifest//\//-}.json"
            set +e
            docker run --rm \
              --mount "type=bind,source=${GITHUB_WORKSPACE},target=/src,readonly" \
              --mount "type=bind,source=${RUNNER_TEMP}/dependency-sca,target=/reports" \
              --workdir /src "$PIP_AUDIT_IMAGE" \
              sh -c 'python -m pip install --disable-pip-version-check --no-cache-dir --quiet "pip-audit==$1" || exit 2; python -m pip_audit --requirement "$2" --format json --output "/reports/$3"' \
              sh "$PIP_AUDIT_VERSION" "$manifest" "${manifest//\//-}.json"
            audit_status=$?
            set -e
            python -c 'import json,sys; data=json.load(open(sys.argv[1], encoding="utf-8")); assert isinstance(data, dict) and isinstance(data.get("dependencies"), list), "invalid pip-audit report"; findings=[(d.get("name"), v.get("id")) for d in data["dependencies"] for v in d.get("vulns", [])]; print(f"{sys.argv[2]}: {len(findings)} known vulnerabilities"); [print(f"  {pkg}: {vuln}") for pkg, vuln in findings]' "$report" "$manifest"
            case "$audit_status" in
              0) ;;
              1) echo "Vulnerabilities are report-only during the initial rollout." ;;
              *) echo "pip-audit execution failed with exit code $audit_status" >&2; exit "$audit_status" ;;
            esac
          done
