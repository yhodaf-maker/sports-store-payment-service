name: Reusable AI Pull Request Review

on:
  workflow_call:
    inputs:
      pull_request_number:
        description: Pull Request number from the trusted caller event
        required: true
        type: number
      repository:
        description: Repository in owner/name form
        required: true
        type: string
      base_commit_sha:
        description: Pull Request base commit SHA
        required: true
        type: string
      head_commit_sha:
        description: Pull Request head commit SHA
        required: true
        type: string
      reviewed_commit_sha:
        description: Exact commit reviewed and displayed in the comment
        required: true
        type: string
      workflow_run_id:
        description: Deterministic CI workflow run identifier
        required: true
        type: number
      required_ci_jobs_json:
        description: Trusted JSON list of deterministic CI jobs that must succeed
        required: true
        type: string
      reviewer_config_json:
        description: Optional trusted runner configuration JSON
        required: false
        default: ""
        type: string
    secrets:
      openrouter_api_key:
        description: OpenRouter API key used only by the review provider
        required: true
    outputs:
      review_status:
        description: Normalized advisory review status
        value: ${{ jobs.ai-review.outputs.review_status }}
      comment_status:
        description: Persistent comment operation status
        value: ${{ jobs.ai-review.outputs.comment_status }}
      reviewed_commit_sha:
        description: Commit SHA accepted by the reviewer
        value: ${{ jobs.ai-review.outputs.reviewed_commit_sha }}

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ inputs.repository }}-${{ inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  ai-review:
    name: Advisory AI review
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true
    outputs:
      review_status: ${{ steps.review.outputs.review_status || steps.bootstrap.outputs.review_status }}
      comment_status: ${{ steps.review.outputs.comment_status || steps.bootstrap.outputs.comment_status }}
      reviewed_commit_sha: ${{ steps.review.outputs.reviewed_commit_sha || steps.bootstrap.outputs.reviewed_commit_sha }}
    steps:
      - name: Checkout trusted base revision
        id: checkout
        continue-on-error: true
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.base_commit_sha }}
          persist-credentials: false

      - name: Set up Python 3.11
        id: python
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install trusted dependencies
        id: dependencies
        if: steps.python.outcome == 'success'
        continue-on-error: true
        run: python -m pip install -r requirements-dev.txt

      - name: Run advisory review
        id: review
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.openrouter_api_key }}
          AI_REVIEW_REPOSITORY: ${{ inputs.repository }}
          AI_REVIEW_PR_NUMBER: ${{ inputs.pull_request_number }}
          AI_REVIEW_BASE_SHA: ${{ inputs.base_commit_sha }}
          AI_REVIEW_HEAD_SHA: ${{ inputs.head_commit_sha }}
          AI_REVIEW_COMMIT_SHA: ${{ inputs.reviewed_commit_sha }}
          AI_REVIEW_WORKFLOW_RUN_ID: ${{ inputs.workflow_run_id }}
          AI_REVIEW_REQUIRED_JOBS_JSON: ${{ inputs.required_ci_jobs_json }}
          AI_REVIEW_CONFIG_JSON: ${{ inputs.reviewer_config_json }}
        run: python -m review_runner.github_review

      - name: Report safe bootstrap failure
        id: bootstrap
        if: steps.review.outcome != 'success'
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_commit_sha }}
        run: |
          printf 'review_status=failed_safely\n' >> "$GITHUB_OUTPUT"
          printf 'comment_status=not_attempted\n' >> "$GITHUB_OUTPUT"
          printf 'reviewed_commit_sha=%s\n' "$REVIEWED_SHA" >> "$GITHUB_OUTPUT"
